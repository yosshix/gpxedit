<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14606E"/>
      <stop offset="1" stop-color="#0B2C3D"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <clipPath id="mapclip">
      <polygon points="150,300 396,248 628,300 874,248 874,728 628,780 396,728 150,780"/>
    </clipPath>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <g filter="url(#sh)">
    <polygon points="150,300 396,248 396,728 150,780" fill="#F7F2E4"/>
    <polygon points="396,248 628,300 628,780 396,728" fill="#E6DFCA"/>
    <polygon points="628,300 874,248 874,728 628,780" fill="#F7F2E4"/>
  </g>
  <g clip-path="url(#mapclip)">
    <polygon points="170,570 340,534 340,650 170,686" fill="#BFDDB0"/>
    <polygon points="660,540 874,500 874,620 660,660" fill="#BFDDB0"/>
    <path d="M120,440 C260,400 330,470 396,440 S540,400 628,470 S780,440 900,390" fill="none" stroke="#8CC3DD" stroke-width="30" stroke-linecap="round"/>
  </g>
  <!-- route: solid up to the cut, dotted after -->
  <path d="M215,712 C290,660 320,590 400,610 S480,640 520,600" fill="none" stroke="#FF6B2C" stroke-width="30" stroke-linecap="round"/>
  <path d="M640,520 C700,490 740,500 790,450" fill="none" stroke="#FF6B2C" stroke-width="30" stroke-linecap="round" stroke-dasharray="1 52"/>
  <circle cx="215" cy="712" r="26" fill="#fff" stroke="#FF6B2C" stroke-width="14"/>
  <!-- pin -->
  <g transform="translate(800,340)" filter="url(#sh)">
    <path d="M0,-88 C-46,-88 -72,-54 -72,-18 C-72,32 0,84 0,84 C0,84 72,32 72,-18 C72,-54 46,-88 0,-88 Z" fill="#E63946" stroke="#fff" stroke-width="10"/>
    <circle cx="0" cy="-20" r="25" fill="#fff"/>
  </g>
  <!-- scissors -->
  <g transform="translate(520,710) rotate(-34) scale(0.95)" filter="url(#sh)">
    <g transform="rotate(-9)"><polygon points="-30,0 -30,-44 330,0" fill="#F3F7FA" stroke="#1C2B33" stroke-width="10" stroke-linejoin="round"/></g>
    <g transform="scale(1,-1) rotate(-9)"><polygon points="-30,0 -30,-44 330,0" fill="#CFDAE2" stroke="#1C2B33" stroke-width="10" stroke-linejoin="round"/></g>
    <path d="M0,0 L-86,-56" stroke="#1C2B33" stroke-width="30" stroke-linecap="round"/>
    <path d="M0,0 L-86,56" stroke="#1C2B33" stroke-width="30" stroke-linecap="round"/>
    <circle cx="-140" cy="-86" r="52" fill="none" stroke="#E63946" stroke-width="30"/>
    <circle cx="-140" cy="86" r="52" fill="none" stroke="#E63946" stroke-width="30"/>
    <circle cx="0" cy="0" r="17" fill="#FFC857" stroke="#1C2B33" stroke-width="8"/>
  </g>
</svg>
